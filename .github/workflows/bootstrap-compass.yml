        run: |
          python3 - <<'PY'
          import base64, io, os, pathlib, tarfile
          data = base64.b64decode("".join(os.environ["PROJECT_ARCHIVE"].split()), validate=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              for item in archive.getmembers():
                  path = pathlib.PurePosixPath(item.name)
                  if path.is_absolute() or ".." in path.parts or not (item.isfile() or item.isdir()):
                      raise RuntimeError(f"Unexpected archive member: {item.name}")
              archive.extractall(".", filter="data")
          PY
      - name: Commit prepared project
        run: |
          rm -f .github/workflows/ci.yml .github/workflows/pages.yml .github/workflows/seed-issues.yml
          git add -A
          git -c user.name="DDUGU Hack Day Bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: initialize AI Compass and beginner contribution infrastructure"
          git push origin HEAD:main
      - name: Seed contribution labels and beginner issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/seed-issues.mjs
